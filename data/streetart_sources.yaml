# Источники для агента 3 - "Стрит-арт радар".
#
# Агент следит за этими Telegram-каналами и ищет новости про новые муралы,
# арт-объекты, уличные инсталляции и стрит-арт Петербурга (граффити - не берём).
#
# Telegram-каналы читаются через веб-витрину t.me/s/<канал> - это работает
# без токена и без регистрации. Поле handle - это имя канала без "@".
#
# Чтобы добавить канал: впишите новую строку в channels с его handle.
# Чтобы убрать - удалите строку. Russia-wide каналы (вся страна) помечайте
# scope: ru, тогда агент строже отбирает по упоминанию Петербурга.

meta:
  city: Санкт-Петербург
  updated: 2026-08-26

# Слова-признаки новинки. Пост попадает в радар, если встретит любое из них.
keywords:
  - мурал
  - граффит
  - арт-объект
  - арт объект
  - паблик-арт
  - паблик арт
  - инсталляц
  - расписал
  - нанес
  - появил
  - новая работа
  - новый объект
  - фасад
  - стен
  - стрит-арт
  - стрит арт
  - уличн

# Художникам ставим scope: spb, даже если они иногда работают в других городах.
# Причина: адрес в их посте выглядит как «Светлановский проспект, 6», а проверка
# scope: ru ищет слово «Петербург» и такой пост выбрасывает. Другой город
# отсеет модель на следующем шаге - она проверяет город по смыслу.
#
# Поле kind: artist - личный канал художника. Такие посты идут к модели без
# фильтра по словам-признакам: у художника лента и есть его работы, а пишет он
# обычно просто «название, адрес», без слова «мурал».
channels:
  # каналы про уличное искусство города
  - {handle: lenstreet,       name: ЛЕНСТРИТ,                 scope: spb}
  - {handle: streetartkeeper, name: Стрит-арт хранитель (САХ), scope: ru}
  - {handle: cultbalagan,     name: БАЛАГАН (культура СПб),    scope: spb}

  # каналы художников, работающих в Петербурге
  - {handle: net_streetart, name: "Net streetart (Vladimir Net)", scope: spb, kind: artist}
  - {handle: maestrojackie, name: "Maestro Jackie",              scope: spb, kind: artist}
  - {handle: numbtrueulya,  name: "Хроники улицы (Ульяна Полоз)", scope: spb, kind: artist}
  - {handle: maximima,      name: "Максим Има",                  scope: spb, kind: artist}

# Паблики ВКонтакте. Читаются через API по ключу VK_TOKEN (см. начало файла
# agents/vk_source.py: как получить и куда положить). Без ключа радар их молча
# пропускает - телеграм при этом работает как раньше.
#
# ВНИМАНИЕ: эти адреса существуют (страницы отвечают), но чем именно живут эти
# сообщества, без ключа не видно - ВК не отдает анонимно ни постов, ни названия.
# Как только ключ появится, проверить одной командой и убрать лишнее:
#   py agents/vk_source.py --groups lenstreet,streetartstorage,streetartspb,streetart_spb,iskusstvo_ulic,muralspb,zaborvspb,cultbalagan,maximima,partizaning,streetartrussia
vk_groups:
  - {domain: lenstreet,        name: "ЛЕНСТРИТ (ВК)",           scope: spb}
  - {domain: streetartstorage, name: "Стрит-арт хранение (ВК)", scope: spb}
  - {domain: streetartspb,     name: "streetartspb (ВК)",       scope: spb}
  - {domain: streetart_spb,    name: "streetart_spb (ВК)",      scope: spb}
  - {domain: iskusstvo_ulic,   name: "Искусство улиц (ВК)",     scope: spb}
  - {domain: muralspb,         name: "muralspb (ВК)",           scope: spb}
  - {domain: zaborvspb,        name: "zaborvspb (ВК)",          scope: spb}
  - {domain: cultbalagan,      name: "БАЛАГАН (ВК)",            scope: spb}
  - {domain: maximima,         name: "Максим Има (ВК)",         scope: spb, kind: artist}
  - {domain: partizaning,      name: "Партизанинг (ВК)",        scope: ru}
  - {domain: streetartrussia,  name: "Стрит-арт Россия (ВК)",   scope: ru}

# Адреса, которых в ВК нет вовсе (проверено 2026-08-26): streetartkeeper, sah_spb,
# kvadrat_spb, vandalizm_spb, spb_murals, urbanart_spb, numbtrueulya.
# Пропущены намеренно: graffitispb, spbgraffiti - это граффити, а его правило
# проекта не берет.

