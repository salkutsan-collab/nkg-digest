# Настройки сборщика событий из KudaGo (agents/kudago.py).
#
# KudaGo - городская афиша с открытым API (без ключа). Дает события на площадках,
# которых нет в нашей базе. Плата за это - мусор в выдаче: студии рисования,
# кафе, торговые центры, детские квесты. Поэтому берем не поток, а отобранное:
#
#   1. запрашиваем только нужные рубрики (use_categories);
#   2. выбрасываем площадки и события по стоп-словам (deny_place, deny_title, deny_tags);
#   3. считаем релевантность нашей теме (topic_words) и берем от min_relevance;
#   4. ограничиваем число событий на один пост (limit_per_theme).
#
# Все списки можно править руками, перезапуск не нужен.

meta:
  updated: 2026-08-26
  location: spb

# Какие рубрики KudaGo вообще запрашиваем.
use_categories: [exhibition, education, festival, theater, cinema, tour, photo]

# Рубрика KudaGo -> наш тип события (типы должны совпадать с themes.yaml).
categories:
  exhibition: выставка
  photo: выставка
  education: лекция
  festival: фестиваль
  theater: спектакль
  cinema: кино
  tour: экскурсия
  concert: концерт
  fashion: маркет

# Стоп-слова в названии площадки: это не наши места.
deny_place:
  - студи
  - кафе
  - ресторан
  - бар
  - паб
  - аэропорт
  - торгов
  - трц
  - тц
  - молл
  - mall
  - отель
  - хостел
  - коворкинг
  - фитнес
  - салон
  - магазин
  - барбершоп
  - боулинг
  - аквапарк
  - зоопарк
  - каток
  - квест
  - антикафе
  - лофт-проект этажи хостел

# Стоп-слова в названии события.
deny_title:
  - квест
  - вечеринка
  - дискотек
  - караоке
  - шоколад
  - дегустац
  - винн
  - тренинг
  - вебинар
  - нетворкинг
  - распродаж
  - ярмарка вакансий
  - гончарн
  - роспись бокалов
  - для детей
  - детск
  - мыловарен
  - свечеварен
  - гадани
  - таро
  - астролог
  - фотозона

# Стоп-слова в описании: так отсекается реклама вместо события
# («билет действует 183 дня, покупаете один раз и ходите шесть месяцев»).
deny_about:
  - билет действует
  - покупаете один раз
  - успейте купить
  - скидк
  - промокод
  - подарочный сертификат
  - всей семьей
  - всей семьёй

# Стоп-метки KudaGo (поле tags).
deny_tags:
  - детям
  - для детей
  - вечеринки
  - квесты
  - распродажи
  - ночные клубы
  - гадания

# Как называется одна и та же площадка у нас и у KudaGo.
# Нужно потому, что угадывание по общим словам дает ложные совпадения
# («Музей истории религии» - не «Музей истории Санкт-Петербурга»).
# Слева - название из participants.yaml, справа - куски названий KudaGo.
place_aliases:
  "Государственный Эрмитаж (включая Главный штаб)": [эрмитаж, главный штаб]
  "Русский музей": [русский музей, корпус бенуа, строгановский дворец,
                    мраморный дворец, михайловский замок, инженерный замок]
  "Музей истории Санкт-Петербурга (Петропавловская крепость)":
    [петропавловская крепость, особняк румянцева, музей истории санкт-петербурга]
  "Мастерская Аникушина (Музей городской скульптуры)": [мастерская аникушина]
  "Севкабель Порт": [севкабель]
  "Новая Голландия": [новая голландия]
  "Музей современного искусства Эрарта": [эрарта]
  "ЦВЗ Манеж": [манеж]
  "Центр современного искусства им. Сергея Курехина": [курехин]
  "Музей Анны Ахматовой в Фонтанном доме": [ахматов, фонтанный дом]
  "Киностудия «Ленфильм»": [ленфильм]
  "Design District DAA": [design district]
  "Арт-центр Пушкинская-10": [пушкинская-10, пушкинская 10]
  "Музей Академии художеств": [академии художеств]
  "Левашовский хлебозавод": [левашовский]
  "Лофт Проект Этажи": [лофт проект этажи, лофт-проект этажи]
  "Marina Gisich Gallery": [марины гисич, marina gisich]
  "Anna Nova Gallery": [анна нова, anna nova]
  "MYTH Gallery": [myth]
  "KGallery": [kgallery, кгэллери]
  "Name Gallery": [name gallery]
  "DiDi Gallery": [didi]
  "Новый музей современного искусства": [новый музей]
  "Центр современного искусства им. Сергея Курехина": [курехин, курёхин]
  "Артмуза": [артмуза]
  "Бертгольд Центр": [бертгольд]
  "Никольские ряды": [никольские ряды]
  "Квартал Ленполиграфмаш": [ленполиграфмаш]

# Слова нашей темы: по ним считается релевантность.
topic_words:
  - дизайн
  - современное искусство
  - искусств
  - художник
  - архитектур
  - скульптур
  - график
  - плакат
  - типографик
  - фотограф
  - инсталляц
  - перформанс
  - керамик
  - текстиль
  - мода
  - предметный
  - урбанистик
  - стрит-арт
  - уличное искусство
  - мурал
  - паблик-арт
  - куратор
  - галере
  - музей

# Порог релевантности для событий KudaGo.
# Своя площадка (есть в participants.yaml) - мы ее уже отобрали руками, порог ниже.
# Незнакомая площадка должна доказать, что событие про нашу тему.
min_relevance: 3
min_relevance_new_place: 4

# Сколько событий KudaGo максимум добавляем к одной теме.
limit_per_theme: 25

# Сколько событий берем с одной площадки, чтобы один музей не занял весь пост.
max_per_place: 2

# Сколько страниц API опрашиваем на одну рубрику (в странице до 100 событий).
pages_per_category: 3
